services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_orders
      POSTGRES_USER: customer_orders
      POSTGRES_PASSWORD: customer_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

